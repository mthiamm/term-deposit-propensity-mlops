name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest -q --cov=src --cov-report=term-missing

  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build a throwaway model
        run: python -m tests.fake_model models/champion

      - name: Build the image
        run: docker build -t term-deposit-api:ci .

      - name: Start the container
        run: docker run -d --name api -p 8000:8000 term-deposit-api:ci

      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API never became healthy"
          exit 1

      - name: Score one customer
        run: |
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age": 41, "job": "admin.", "marital": "married", "education": "secondary",
                 "default": "no", "balance": 1200, "housing": "yes", "loan": "no",
                 "contact": "cellular", "day": 15, "month": "may", "campaign": 2,
                 "pdays": -1, "previous": 0, "poutcome": "unknown"}' \
          | python -c "import sys, json; p = json.load(sys.stdin)['probability']; assert 0 <= p <= 1, p; print('probability', p)"

      - name: Check the metrics endpoint
        run: curl -fsS http://localhost:8000/metrics | grep api_requests_total

      - name: Show container logs if anything failed
        if: failure()
        run: docker logs api      