global:
  scrape_interval: 15s   # how often Prometheus polls each target

scrape_configs:
  - job_name: term-deposit-api
    static_configs:
      - targets: ["api:8000"]   # service name + port; polls /metrics by default

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]